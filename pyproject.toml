[project]
name = "t1-agent"
version = "0.1.0"
description = "Framework-agnostic LLM agent core: @tool schemas, async ReAct loop, Docker sandbox and guardrails"
readme = "README.md"
authors = [
    { name = "Andrey Potapov", email = "info@nsstms.ru" }
]
requires-python = ">=3.11"
dependencies = [
    "openai>=3.37.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: needs Docker and the t1-sandbox image"]

[tool.uv.build-backend]
module-name = "miniagent"